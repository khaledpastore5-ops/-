<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ونس - دردشة صوتية</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #6c4cff;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 16px;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .welcome h2 {
      margin-bottom: 10px;
      color: #6c4cff;
    }

    .welcome p {
      color: #666;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 16px;
      text-align: right;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #6c4cff;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #5638e8;
    }

    .rooms {
      margin-top: 25px;
    }

    .rooms h3 {
      margin-bottom: 15px;
    }

    .room {
      background: white;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    .room button {
      width: auto;
      padding: 10px 20px;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #888;
      padding: 30px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎙️ ونس</h1>
    <p>منصة للدردشة الصوتية والغرف المباشرة</p>
  </header>

  <div class="container">

    <div class="welcome">
      <h2>أهلًا بك في ونس 👋</h2>
      <p>تحدث مع الآخرين وانضم إلى غرف صوتية ممتعة.</p>

      <input
        type="text"
        id="username"
        placeholder="اكتب اسمك هنا"
      >

      <button onclick="joinChat()">
        دخول إلى المنصة
      </button>
    </div>

    <div class="rooms">

      <h3>🎧 الغرف الصوتية</h3>

      <div class="room">
        <div>
          <strong>غرفة التعارف</strong>
          <br>
          <small>👥 غرفة عامة</small>
        </div>

        <button onclick="joinRoom('غرفة التعارف')">
          دخول
        </button>
      </div>

      <div class="room">
        <div>
          <strong>غرفة الأصدقاء</strong>
          <br>
          <small>👥 دردشة عامة</small>
        </div>

        <button onclick="joinRoom('غرفة الأصدقاء')">
          دخول
        </button>
      </div>

      <div class="room">
        <div>
          <strong>غرفة الجزائر 🇩🇿</strong>
          <br>
          <small>👥 دردشة جزائرية</small>
        </div>

        <button onclick="joinRoom('غرفة الجزائر')">
          دخول
        </button>
      </div>

    </div>

  </div>

  <footer>
    © 2026 ونس - جميع الحقوق محفوظة
  </footer>

  <script>
    function joinChat() {
      const username = document.getElementById("username").value;

      if (username.trim() === "") {
        alert("من فضلك اكتب اسمك أولًا");
        return;
      }

      alert("مرحبًا بك يا " + username + " 👋");
    }

    function joinRoom(roomName) {
      const username = document.getElementById("username").value;

      if (username.trim() === "") {
        alert("اكتب اسمك أولًا ثم ادخل إلى الغرفة");
        return;
      }

      alert(
        "مرحبًا " + username +
        " 👋\nأنت الآن تدخل إلى: " + roomName
      );
    }
  </
