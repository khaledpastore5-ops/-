8<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ونس</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
}

header{
background:#6c4cff;
color:#fff;
padding:20px;
text-align:center;
}

.container{
max-width:500px;
margin:20px auto;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:10px;
}

button{
width:100%;
padding:14px;
background:#6c4cff;
color:#fff;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

.room{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
border:1px solid #eee;
border-radius:10px;
margin-top:10px;
}
</style>
</head>

<body>

<header>
<h1>🎤 ونس</h1>
<p>منصة للدردشة الصوتية والغرف المباشرة</p>
</header>

<div class="container">

<div class="card" id="roomsCard" style="display:none;">
<h2>أهلاً بك</h2>

<input id="email" type="email" placeholder="البريد الإلكتروني">

<input id="password" type="password" placeholder="كلمة المرور">

<button id="loginBtn">دخول</button>

</div>

<div class="card" id="authCard">
<h2>الغرف الصوتية</h2>

<div class="room">
<p>مرحبًا <span id="userEmailSpan"></span></p>
<button>دخول</button>
</div>

<div class="room">
<span>غرفة الأصدقاء</span>
<button>دخول</button>
</div>

<div class="room">
<span>غرفة الجزائر 🇩🇿</span>
<button>دخول</button>
</div>

</div>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAAf6MEr-ehw676UDWdu8FhfDJQdsCv9Ik",
  authDomain: "ouns-29420.firebaseapp.com",
  projectId: "ouns-29420",
  storageBucket: "ouns-29420.firebasestorage.app",
  messagingSenderId: "407525738381",
  appId: "1:407525738381:web:93096f58e56d8d4d82dfc4",
  measurementId: "G-M6J24WBQE3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    const userCredential = await signInWithEmailAndPassword(
  auth,
  email,
  password
);

document.getElementById("authCard").style.display = "none";
document.getElementById("roomsCard").style.display = "block";
document.getElementById("userEmailSpan").innerText =
  userCredential.user.email;

alert("تم تسجيل الدخول بنجاح");
  } catch (e) {
    alert(e.code + "\n" + e.message);
  }
};</script>
</body>
</html>
