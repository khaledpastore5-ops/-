<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ونس</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
}

header{
background:#6c4cff;
color:#fff;
padding:20px;
text-align:center;
}

.container{
max-width:500px;
margin:20px auto;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
background:#6c4cff;
color:#fff;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
margin-top:10px;
}

button.secondary{
background:#444;
}

button.red{
background:#d63031;
}

.room{
padding:15px;
border:1px solid #eee;
border-radius:10px;
margin-top:10px;
}

#roomsCard,
#voiceRoomCard{
display:none;
}

.mic-status{
text-align:center;
font-size:20px;
padding:20px;
background:#f5f7fb;
border-radius:15px;
margin:15px 0;
}
</style>
</head>

<body>

<header>
<h1>🎤 ونس</h1>
<p>منصة للدردشة الصوتية والغرف المباشرة</p>
</header>

<div class="container">

<!-- تسجيل الدخول -->
<div class="card" id="authCard">

<h2>أهلاً بك في ونس 👋</h2>

<input id="email" type="email" placeholder="البريد الإلكتروني">

<input id="password" type="password" placeholder="كلمة المرور">

<button id="loginBtn">تسجيل الدخول</button>

<button id="registerBtn">إنشاء حساب جديد</button>

</div>


<!-- قائمة الغرف -->
<div class="card" id="roomsCard">

<h2>الغرف الصوتية 🎧</h2>

<p>مرحباً <span id="userEmailSpan"></span> 👋</p>

<button id="logoutBtn" class="secondary">
تسجيل الخروج
</button>

<div class="room">

<h3>غرفة التعارف 👥</h3>

<p>غرفة عامة للتعارف</p>

<button id="joinRoomBtn">
دخول إلى الغرفة
</button>

</div>

<div class="room">

<h3>غرفة الأصدقاء 👥</h3>

<p>دردشة عامة</p>

<button disabled>
قريباً
</button>

</div>

<div class="room">

<h3>غرفة الجزائر 🇩🇿</h3>

<p>دردشة جزائرية</p>

<button disabled>
قريباً
</button>
<h3>الغرف الخاصة 🔒</h3>

<button id="createRoomBtn">
➕ إنشاء غرفة خاصة
</button>

<input
id="roomCode"
type="text"
placeholder="أدخل رمز الغرفة">

<button id="joinPrivateBtn">
🚪 دخول الغرفة
</button>
</div>

</div>


<!-- غرفة الصوت -->
<div class="card" id="voiceRoomCard">

<h2>🎙️ غرفة التعارف</h2>

<p>
المستخدم:
<span id="roomUserEmail"></span>
</p>

<div class="mic-status" id="micStatus">
الميكروفون متوقف 🔇
</div>

<button id="micBtn">
🎤 تشغيل الميكروفون
</button>

<button id="leaveRoomBtn" class="red">
🚪 مغادرة الغرفة
</button>

</div>

</div>


<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  getDocs,
  updateDoc,
  onSnapshot,
  collection,
  addDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
  

  



  
  


  


  
  
  
  
  

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

apiKey: "AIzaSyAAf6MEr-ehw676UDWdu8FhfDJQdsCv9Ik",

authDomain: "ouns-29420.firebaseapp.com",

projectId: "ouns-29420",

storageBucket: "ouns-29420.firebasestorage.app",

messagingSenderId: "407525738381",

appId: "1:407525738381:web:93096f58e56d8d4d82dfc4",

measurementId: "G-M6J24WBQE3"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);


const emailInput = document.getElementById("email");

const passwordInput = document.getElementById("password");

const loginBtn = document.getElementById("loginBtn");

const registerBtn = document.getElementById("registerBtn");

const logoutBtn = document.getElementById("logoutBtn");

const authCard = document.getElementById("authCard");

const roomsCard = document.getElementById("roomsCard");

const voiceRoomCard = document.getElementById("voiceRoomCard");

const userEmailSpan = document.getElementById("userEmailSpan");

const roomUserEmail = document.getElementById("roomUserEmail");

const joinRoomBtn = document.getElementById("joinRoomBtn");

const leaveRoomBtn = document.getElementById("leaveRoomBtn");

const micBtn = document.getElementById("micBtn");

const micStatus = document.getElementById("micStatus");
const createRoomBtn = document.getElementById("createRoomBtn");
const joinPrivateBtn = document.getElementById("joinPrivateBtn");
const roomCodeInput = document.getElementById("roomCode");
let localStream = null;
let peerConnection = null;
let currentRoomId = "";
const rtcConfig = {
  iceServers: [
    {
      urls: [
        "stun:stun.l.google.com:19302",
        "stun:stun1.l.google.com:19302"
      ]
    }
  ]
};

function createPeer() {
  peerConnection = new RTCPeerConnection(rtcConfig);
peerConnection.onicecandidate = async (event) => {

  if (event.candidate && currentRoomId) {

    await addDoc(
      collection(db, "rooms", currentRoomId, "callerCandidates"),
      event.candidate.toJSON()
    );

  }

};
  if (localStream) {
    localStream.getTracks().forEach(track => {
      peerConnection.addTrack(track, localStream);
    });
  }

  peerConnection.ontrack = (event) => {
    let audio = document.getElementById("remoteAudio");

    if (!audio) {
      audio = document.createElement("audio");
      audio.id = "remoteAudio";
      audio.autoplay = true;
      document.body.appendChild(audio);
    }

    audio.srcObject = event.streams[0];
  };

  return peerConnection;
}async function createOffer(roomId) {
currentRoomId = roomId;
  createPeer();
}

async function createOffer(roomId) {
  const offer = await peerConnection.createOffer();

  await peerConnection.setLocalDescription(offer);

  await updateDoc(doc(db, "rooms", roomId), {
    offer: {
      type: offer.type,
      sdp: offer.sdp
    }
  });

}

async function joinOffer(roomId) {

  const roomRef = doc(db, "rooms", roomId);

  const room = await getDoc(roomRef);

  if (!room.exists()) {
    alert("الغرفة غير موجودة");
    return;
  }

  createPeer();

  const data = room.data();

  await peerConnection.setRemoteDescription(
    new RTCSessionDescription(data.offer)
  );


  const answer = await peerConnection.createAnswer();

  await peerConnection.setLocalDescription(answer);


  peerConnection.onicecandidate = async (event) => {

    if (event.candidate) {

      await addDoc(
        collection(db, "rooms", roomId, "answerCandidates"),
        event.candidate.toJSON()
      );

    }

  };


  await updateDoc(roomRef, {

    answer: {
      type: answer.type,
      sdp: answer.sdp
    }

  });


  const callerCandidates = await getDocs(
    collection(db, "rooms", roomId, "callerCandidates")
  );


  callerCandidates.forEach((candidate) => {

    peerConnection.addIceCandidate(
      new RTCIceCandidate(candidate.data())
    );

  });


  onSnapshot(roomRef, async (snapshot) => {

    const data = snapshot.data();

    if (
      data.answer &&
      !peerConnection.currentRemoteDescription
    ) {

      await peerConnection.setRemoteDescription(
        new RTCSessionDescription(data.answer)
      );

    }

  });


  const answerCandidatesRef = collection(
    db,
    "rooms",
    roomId,
    "answerCandidates"
  );


  onSnapshot(answerCandidatesRef, (snapshot) => {

    snapshot.docChanges().forEach((change) => {

      if (change.type === "added") {

        peerConnection.addIceCandidate(
          new RTCIceCandidate(change.doc.data())
        );

      }

    });

  });

  }
// إنشاء غرفة خاصة
createRoomBtn.onclick = async () => {

  const code = Math.random().toString(36).substring(2, 8).toUpperCase();

  try {

    await setDoc(doc(db, "rooms", code), {
      createdAt: Date.now(),
      owner: auth.currentUser.email
    });
await createOffer(code);
    roomCodeInput.value = code;
localStream = await navigator.mediaDevices.getUserMedia({
  audio:true
});

await createOffer(code);

roomsCard.style.display = "none";
voiceRoomCard.style.display = "block";

roomUserEmail.innerText = auth.currentUser.email;
micStatus.innerText = "🎤 الميكروفون يعمل";
    alert("تم إنشاء الغرفة 🎉\nرمزها: " + code);

  } catch (e) {

    alert("خطأ: " + e.message);

  }

};
// دخول غرفة خاصة
joinPrivateBtn.onclick = async () => {

  const code = roomCodeInput.value.trim().toUpperCase();

  if (!code) {
    alert("أدخل رمز الغرفة");
    return;
  }

  try {

    localStream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    await joinOffer(code);

    roomsCard.style.display = "none";
    voiceRoomCard.style.display = "block";

    roomUserEmail.innerText = auth.currentUser.email;
    micStatus.innerText = "🎤 الميكروفون يعمل";

    alert("تم الانضمام إلى الغرفة 🎉");

  } catch (e) {

    alert("خطأ: " + e.message);

  }

};

  

  
  
    
  




// إنشاء حساب

registerBtn.onclick = async () => {

const email = emailInput.value.trim();

const password = passwordInput.value;

if (!email || !password) {

alert("أدخل البريد الإلكتروني وكلمة المرور");

return;

}

if (password.length < 6) {

alert("كلمة المرور يجب أن تكون 6 أحرف على الأقل");

return;

}

try {

await createUserWithEmailAndPassword(
auth,
email,
password
);

alert("تم إنشاء الحساب بنجاح 🎉");

} catch (e) {

alert("خطأ: " + e.message);

}

};


// تسجيل الدخول

loginBtn.onclick = async () => {

const email = emailInput.value.trim();
const password = passwordInput.value.trim();

if (!email || !password) {
alert("أدخل البريد وكلمة المرور");
return;
}

try {

const userCredential = await signInWithEmailAndPassword(
auth,
email,
password
);

alert("تم الدخول: " + userCredential.user.email);

} catch(error) {

console.log(error);

alert(error.code + "\n" + error.message);

}

};






// دخول غرفة التعارف

joinRoomBtn.onclick = async () => {

  try {

    localStream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    roomsCard.style.display = "none";

    voiceRoomCard.style.display = "block";

    roomUserEmail.innerText = auth.currentUser.email;

    micStatus.innerText = "🎤 الميكروفون يعمل";

    alert("تم دخول الغرفة الصوتية 🎉");

  } catch (e) {

    alert("لم نتمكن من تشغيل الميكروفون: " + e.message);

  }

};



// الخروج من الغرفة

leaveRoomBtn.onclick = () => {

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());

    localStream = null;

  }

  voiceRoomCard.style.display = "none";
  roomsCard.style.display = "block";

};


// تشغيل وإيقاف الميكروفون

micBtn.onclick = () => {

  if (!localStream) return;

  const audioTrack = localStream.getAudioTracks()[0];

  audioTrack.enabled = !audioTrack.enabled;

  if (audioTrack.enabled) {

    micBtn.innerText = "🔇 كتم الميكروفون";
    micStatus.innerText = "🎤 الميكروفون يعمل";
  } else {

    micBtn.innerText = "🎤 تشغيل الميكروفون";
    micStatus.innerText = "🔇 الميكروفون متوقف";

  }

};



// تسجيل الخروج

logoutBtn.onclick = async () => {

  if (localStream) {

    localStream.getTracks().forEach(track => track.stop());

    localStream = null;

  }

  await signOut(auth);

};


// مراقبة حالة تسجيل الدخول

onAuthStateChanged(auth, (user) => {

  if (user) {

    authCard.style.display = "none";
    roomsCard.style.display = "block";

    userEmailSpan.innerText = user.email;

  } else {

    authCard.style.display = "block";
    roomsCard.style.display = "none";
    voiceRoomCard.style.display = "none";

  }

});

</script>
</body>
</html>
