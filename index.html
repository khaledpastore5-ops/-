<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ونس</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
}

header{
background:#6c4cff;
color:#fff;
padding:20px;
text-align:center;
}

.container{
max-width:500px;
margin:20px auto;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
background:#6c4cff;
color:#fff;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
margin-top:10px;
}

button.secondary{
background:#444;
}

.room{
padding:15px;
border:1px solid #eee;
border-radius:10px;
margin-top:10px;
}

#roomsCard{
display:none;
}
</style>
</head>

<body>

<header>
<h1>🎤 ونس</h1>
<p>منصة للدردشة الصوتية والغرف المباشرة</p>
</header>

<div class="container">

<!-- تسجيل الدخول وإنشاء الحساب -->
<div class="card" id="authCard">

<h2>أهلاً بك في ونس 👋</h2>

<input id="email" type="email" placeholder="البريد الإلكتروني">

<input id="password" type="password" placeholder="كلمة المرور">

<button id="loginBtn">تسجيل الدخول</button>

<button id="registerBtn">إنشاء حساب جديد</button>

</div>

<!-- الغرف -->
<div class="card" id="roomsCard">

<h2>الغرف الصوتية 🎧</h2>

<p>مرحباً <span id="userEmailSpan"></span> 👋</p>

<button id="logoutBtn" class="secondary">تسجيل الخروج</button>

<div class="room">
<h3>غرفة التعارف 👥</h3>
<p>غرفة عامة للتعارف</p>
<button>دخول</button>
</div>

<div class="room">
<h3>غرفة الأصدقاء 👥</h3>
<p>دردشة عامة</p>
<button>دخول</button>
</div>

<div class="room">
<h3>غرفة الجزائر 🇩🇿</h3>
<p>دردشة جزائرية</p>
<button>دخول</button>
</div>

</div>

</div>

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import { 
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} 
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

apiKey: "AIzaSyAAf6MEr-ehw676UDWdu8FhfDJQdsCv9Ik",

authDomain: "ouns-29420.firebaseapp.com",

projectId: "ouns-29420",

storageBucket: "ouns-29420.firebasestorage.app",

messagingSenderId: "407525738381",

appId: "1:407525738381:web:93096f58e56d8d4d82dfc4",

measurementId: "G-M6J24WBQE3"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


const emailInput = document.getElementById("email");

const passwordInput = document.getElementById("password");

const loginBtn = document.getElementById("loginBtn");

const registerBtn = document.getElementById("registerBtn");

const logoutBtn = document.getElementById("logoutBtn");

const authCard = document.getElementById("authCard");

const roomsCard = document.getElementById("roomsCard");

const userEmailSpan = document.getElementById("userEmailSpan");


// إنشاء حساب جديد

registerBtn.onclick = async () => {

const email = emailInput.value.trim();

const password = passwordInput.value;

if (!email || !password) {

alert("أدخل البريد الإلكتروني وكلمة المرور");

return;

}

if (password.length < 6) {

alert("كلمة المرور يجب أن تكون 6 أحرف على الأقل");

return;

}

try {

await createUserWithEmailAndPassword(
auth,
email,
password
);

alert("تم إنشاء الحساب بنجاح 🎉");

} catch (e) {

alert("خطأ: " + e.message);

}

};


// تسجيل الدخول

loginBtn.onclick = async () => {

const email = emailInput.value.trim();

const password = passwordInput.value;

if (!email || !password) {

alert("أدخل البريد الإلكتروني وكلمة المرور");

return;

}

try {

await signInWithEmailAndPassword(
auth,
email,
password
);

alert("تم تسجيل الدخول بنجاح 🎉");

} catch (e) {

alert("خطأ في تسجيل الدخول: " + e.message);

}

};


// تسجيل الخروج

logoutBtn.onclick = async () => {

await signOut(auth);

alert("تم تسجيل الخروج");

};


// مراقبة حالة المستخدم

onAuthStateChanged(auth, (user) => {

if (user) {

authCard.style.display = "none";

roomsCard.style.display = "block";

userEmailSpan.innerText = user.email;

} else {

authCard.style.display = "block";

roomsCard.style.display = "none";

}

});

</script>

</body>
</html>
