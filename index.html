<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ونس</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
}

header{
background:#6c4cff;
color:#fff;
padding:20px;
text-align:center;
}

.container{
max-width:500px;
margin:20px auto;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:10px;
}

button{
width:100%;
padding:14px;
background:#6c4cff;
color:#fff;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

.room{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
border:1px solid #eee;
border-radius:10px;
margin-top:10px;
}
</style>
</head>

<body>

<header>
<h1>🎤 ونس</h1>
<p>منصة للدردشة الصوتية والغرف المباشرة</p>
</header>

<div class="container">

<div class="card">
<h2>أهلاً بك</h2>

<input id="email" type="email" placeholder="البريد الإلكتروني">

<input id="password" type="password" placeholder="كلمة المرور">

<button id="loginBtn">دخول</button>

</div>

<div class="card">
<h2>الغرف الصوتية</h2>

<div class="room">
<span>غرفة التعارف</span>
<button>دخول</button>
</div>

<div class="room">
<span>غرفة الأصدقاء</span>
<button>دخول</button>
</div>

<div class="room">
<span>غرفة الجزائر 🇩🇿</span>
<button>دخول</button>
</div>

</div>

</div>

</body>
</html>
